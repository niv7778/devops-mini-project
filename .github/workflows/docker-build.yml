name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ ! -d ~/devops-mini-project ]; then
              git clone https://github.com/niv7778/devops-mini-project.git ~/devops-mini-project
            fi
            cd ~/devops-mini-project
            git pull origin main
            docker build -t devops-mini-project .
            docker stop app || true
            docker rm app || true
            docker run -d --name app -p 5001:5000 devops-mini-project